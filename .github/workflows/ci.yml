name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=optional
      - name: Syntax check
        run: for f in server/*.js web/app.js web/admin.js agent/index.js; do node --check "$f"; done
