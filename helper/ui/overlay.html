<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DevAssist pointers</title>
  <!-- A transparent, click-through window over the whole screen that draws
       the call's pointers where people are pointing at this screen. -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    .pointer { position: absolute; left: 0; top: 0; display: flex; align-items: flex-start; transition: transform 70ms linear, opacity .4s; }
    .pointer svg { width: 26px; height: 26px; fill: var(--c); stroke: #fff; stroke-width: 1.5; stroke-linejoin: round; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
    .pointer span { margin: 19px 0 0 -4px; padding: 2px 9px; border-radius: 999px; background: var(--c); color: #fff; font: 600 13px/1.4 system-ui, sans-serif; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
    .pointer.idle { opacity: .35; }
  </style>
</head>
<body>
  <script>
    const { listen } = window.__TAURI__.event;
    const pointers = new Map();
    listen('pointer', ({ payload: m }) => {
      let el = pointers.get(m.id);
      if (m.type === 'pointeroff') { el?.remove(); pointers.delete(m.id); return; }
      if (!el) {
        el = document.createElement('div');
        el.className = 'pointer';
        el.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4.04 4.69a.5.5 0 0 1 .65-.65l16 6.5a.5.5 0 0 1-.06.95l-6.13 1.58a2 2 0 0 0-1.43 1.44l-1.58 6.12a.5.5 0 0 1-.95.06z"/></svg><span></span>';
        el.style.transition = 'none';
        document.body.append(el);
        pointers.set(m.id, el);
        requestAnimationFrame(() => { el.style.transition = ''; });
      }
      el.style.setProperty('--c', /^#[0-9a-f]{3,8}$/i.test(m.color) ? m.color : '#f97316');
      el.querySelector('span').textContent = m.name;
      el.style.transform = `translate(${m.x * innerWidth - 4}px, ${m.y * innerHeight - 4}px)`;
      el.classList.remove('idle');
      clearTimeout(el.idle);
      el.idle = setTimeout(() => el.classList.add('idle'), 4000);
    });
    listen('pointers-clear', () => { for (const el of pointers.values()) el.remove(); pointers.clear(); });
  </script>
</body>
</html>
