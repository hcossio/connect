<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>Sign in · DevAssist</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Cpath d='M11 8v15l4-4 3 6 2.5-1.2-3-5.8H23z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="var(--accent)" stroke="none"/><path d="M11 8v15l4-4 3 6 2.5-1.2-3-5.8H23z" fill="#fff" stroke="none"/></symbol>
  </svg>
  <section class="lobby">
    <form id="loginForm" class="lobby-form auth-card">
      <div class="brand"><svg class="logo"><use href="#i-logo"/></svg>DevAssist</div>
      <h1>Sign in</h1>
      <p class="muted">Sign in to start meetings. Guests don't need an account; they join with your link.</p>
      <label class="field"><span>Username or email</span>
        <input id="login" autocomplete="username" autocapitalize="off" required>
      </label>
      <label class="field"><span>Password</span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="error" class="form-error" hidden></p>
      <button id="submit" class="btn primary block" type="submit">Sign in</button>
    </form>
  </section>
  <script>
    const next = new URLSearchParams(location.search).get('next');
    const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      const btn = document.getElementById('submit');
      err.hidden = true;
      btn.disabled = true;
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login: document.getElementById('login').value, password: document.getElementById('password').value }),
        });
        if (r.ok) return location.replace(safeNext);
        err.textContent = (await r.json().catch(() => ({}))).error || 'Could not sign in.';
      } catch { err.textContent = 'Could not reach the server.'; }
      err.hidden = false;
      btn.disabled = false;
    };
  </script>
</body>
</html>
