[package]
name = "devassist-helper"
version = "0.1.1"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
enigo = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
