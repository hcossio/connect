<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Sign in · Connect</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M11 8v15l4-4 3 6 2.5-1.2-3-5.8H23z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section class="auth">
    <header class="topnav"><a class="wordmark" href="/" style="text-decoration:none">Connect</a></header>
    <form id="loginForm" class="auth-card">
      <h1>Welcome back.</h1>
      <input id="login" placeholder="Username or email" aria-label="Username or email" autocomplete="username" autocapitalize="off" required>
      <input id="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
      <p id="error" class="form-error" hidden></p>
      <button id="submit" class="btn primary block" type="submit">Sign in</button>
      <p class="muted small hint">Guests don't need an account. They join with your link.</p>
    </form>
  </section>
  <script>
    const next = new URLSearchParams(location.search).get('next');
    const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      const btn = document.getElementById('submit');
      err.hidden = true;
      btn.disabled = true;
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login: document.getElementById('login').value, password: document.getElementById('password').value }),
        });
        if (r.ok) return location.replace(safeNext);
        err.textContent = (await r.json().catch(() => ({}))).error || 'Could not sign in.';
      } catch { err.textContent = 'Could not reach the server.'; }
      err.hidden = false;
      btn.disabled = false;
    };
  </script>
</body>
</html>
